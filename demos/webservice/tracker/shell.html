<!doctype html>
<!-- The tracker on the left, this conversation's chat on the right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater tracker</title>
<style>
  :root { color-scheme: light dark; --line: #d4d4d8; --bg: #fafafa; }
  @media (prefers-color-scheme: dark) { :root { --line: #3f3f46; --bg: #18181b; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font: 13px system-ui, sans-serif; }
  #layout { display: flex; height: 100%; }
  #app { flex: 1; min-width: 0; }
  #chat { flex: none; width: var(--chat-width, 440px); border-left: 1px solid var(--line); }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: Canvas; }
  #missing { padding: 16px; opacity: 0.7; }
</style>
</head>
<body>
<div id="layout">
  <div id="app"><iframe id="tracker" title="Shipment tracker" src="app/"></iframe></div>
  <div id="chat"></div>
</div>
<script>
  "use strict";
  const CHAT_URL = "@CHAT_URL@";
  const chat = document.getElementById("chat");
  if (CHAT_URL && !CHAT_URL.startsWith("@")) {
    const f = document.createElement("iframe");
    f.id = "scooter";
    f.title = "Scooter chat";
    f.src = CHAT_URL;
    f.allow = "clipboard-read; clipboard-write";
    chat.append(f);
  } else {
    chat.innerHTML = '<p id="missing">No chat URL: this sandbox has no CONVERSATION_URL.</p>';
  }
</script>
</body>
</html>
