# The tracker is Review's target, baked into the sandbox image (nix/review-app.nix).
title: Tidewater shipment tracker
turns:
  # Off camera: the scene opens Review from this reply's link.
  - prompt: Open our shipment tracker
    steps:
      - shell:
          # Runs during sandbox boot, so retry until active.
          command: until systemctl is-active -q webservice-review; do scooter-service start review >/tmp/start.log 2>&1; sleep 1; done; cat /tmp/start.log
          capture: { url: 'url: (https://\S+/review/)' }
      - say: |
          The tracker is up in Review: [Shipment tracker](${url})

          Press **Point** and click anything you want changed, then leave a note. I'll edit the app and the page reloads.

  # Notes wake the agent from Review, matched on their text; `id` is the note's.
  - match: 'Review note #\d+ \[(?<id>[0-9a-f-]+)\].*Delayed stand out'
    steps:
      - think: Every status badge is the same washed-out grey. I'll give each status its own colour and make Delayed red, with a dot so it scans at a glance.
      - write: { path: /workspace/tracker/styles.css, from: edits/styles.css, duration: 900 }
      - shell: { command: 'review reply ${id} "Each status has its own colour; Delayed is red." && review resolve ${id}' }
      - say: Status badges now have their own colours, and Delayed is red.

  - match: 'Review note #\d+ \[(?<id>[0-9a-f-]+)\].*reads ETA first'
    steps:
      - think: The columns come from the COLUMNS list in app.js, so I'll move ETA up to sit after Shipment.
      - write: { path: /workspace/tracker/app.js, from: edits/app.js, duration: 700 }
      - shell: { command: 'review reply ${id} "ETA is the second column now." && review resolve ${id}' }
      - say: ETA is now the second column, right after the shipment ID.

  - match: 'Review note #\d+ \[(?<id>[0-9a-f-]+)\].*our logo'
    steps:
      - think: The header shows only the name. I'll add the Tidewater mark, a house over a wave, inline in index.html so it needs no new asset.
      - write: { path: /workspace/tracker/index.html, from: edits/index.html, duration: 700 }
      - shell: { command: 'review reply ${id} "Added the Tidewater mark beside the name." && review resolve ${id}' }
      - say: The Tidewater logo is in the header now. All three notes are done.
